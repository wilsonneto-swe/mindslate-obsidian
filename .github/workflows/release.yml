# Builds the plugin and drafts a GitHub release when a version tag is pushed (Obsidian's recommended workflow:
# https://docs.obsidian.md/Plugins/Releasing/Release+your+plugin+with+GitHub+Actions). The tag must be the
# version in manifest.json, x.y.z without a "v". The assets carry build attestations, which let Obsidian's
# community directory check that the release was built from this repository's code. Publish the draft once its
# notes are written.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: The tag is the manifest's version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi
          if [ "$(node -p "require('./versions.json')['$version']")" != "$(node -p "require('./manifest.json').minAppVersion")" ]; then
            echo "versions.json does not map $version to the manifest's minAppVersion" >&2
            exit 1
          fi

      - name: Check and build plugin
        run: |
          npm ci
          npm run check

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
