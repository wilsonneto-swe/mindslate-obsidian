name: Bug report
description: Something in Mindslate doesn't work as described in the README.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For questions and help, use [Discussions](https://github.com/wilsonneto-swe/mindslate-obsidian/discussions) instead.
  - type: input
    id: plugin-version
    attributes:
      label: Mindslate version
      description: Settings > Community plugins shows it.
      placeholder: "0.1.2"
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: Settings > General shows it.
      placeholder: "1.14.5"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Choose every platform where it happens.
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - iOS or iPadOS
        - Android
    validations:
      required: true
  - type: dropdown
    id: sync
    attributes:
      label: How the vault syncs
      multiple: true
      options:
        - Not synced
        - Obsidian Sync
        - iCloud
        - Git
        - Another service (Dropbox, Syncthing, OneDrive...)
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From opening the note to the problem, with the keys you pressed or what you clicked.
      placeholder: |
        1. Open "Example.md" with Mindslate: Open as mind map.
        2. Select "Eat" and press Tab.
        3. Type "Seafood" and press Enter.
        4. ...
    validations:
      required: true
  - type: textarea
    id: sample-note
    attributes:
      label: A note that shows the problem
      description: |
        As small as you can make it. Replace anything personal with placeholder text. Paste it between ```markdown fences, or attach the file. If the map changed the note in a way it shouldn't have, give the note before and after; when spaces, tabs or line endings matter, attach the files rather than pasting them.
      placeholder: |
        ```markdown
        # Example

        - First
            - Child
        - Second
        ```
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Errors from the developer console
      description: "Desktop only: View > Toggle Developer Tools (Ctrl+Shift+I, or Cmd+Option+I on a Mac), then the Console tab. Paste any error that mentions mindslate."
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: The sample note and the steps contain no personal data.
          required: true
